[package]
name = "soundlore"
version = "0.1.0"
edition = "2024"
description = "A fast local music library where you design your own tagging systems and every tag becomes a playlist you can mix."
license = "MIT"

[features]
development = ["iced/debug"]
hot-reload = ["development", "iced/hot"]
testing = ["dep:iced_test"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soundlore_lib"

[dependencies]
async-trait = "0.1.91"
cpal = { version = "0.17.3", features = ["audio_thread_priority"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["context_menu", "menu", "quad"] }
iced_palace = "0.14.0"
iced_split = "0.1.0"
iced_test = { version = "0.14.0", optional = true }  # For testing utils
itertools = "0.15.0"
palette = "0.7.6"
rand = "0.10.2"
rfd = "0.17.2"
rtrb = "0.4.0"
rubato = "3.0.0"
rustc-hash = "2.1.3"
sea-query = { version = "1.0.0-rc.32", features = ["backend-sqlite", "derive"] }
sea-query-sqlx = { version = "0.8.0-rc.14", features = ["sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
sqlx = {
  version = "0.8",
  features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
  ]
}
strum = { version = "0.28.0", features = ["derive"] }
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2"
tokio = { version = "1.52.3" }
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_info"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
ffmpeg-sidecar = "2.5.1"
futures = "0.3.32"
iced_test = "0.14.0"
pretty_assertions = "1.4.1"
rayon = "1.12.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_const_for_fn = "allow"
must_use_candidate = "allow"
suboptimal_flops = "allow"

missing_errors_doc = "allow"
missing_panics_doc = "allow"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

needless_pass_by_value = "allow"

implicit_hasher = "allow"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
