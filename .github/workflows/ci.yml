name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v4
        with:
          install_args: just typos

      - name: Check spelling
        run: typos

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config ffmpeg

      - name: Check lints and formatting
        run: just check --all-targets --locked -- -D warnings

      - name: Run tests
        run: just test --locked
